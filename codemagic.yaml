workflows:
  cercano-oriente-android:
    name: Cercano Oriente Android APK
    instance_type: linux_x2
    max_build_duration: 60
    environment:
      flutter: stable
    scripts:
      - name: Generate Android platform files
        script: flutter create --platforms=android .
      - name: Remove generated default widget test
        script: rm -f test/widget_test.dart
      - name: Dependencies
        script: flutter pub get
      - name: Analyze and test
        script: flutter analyze && flutter test
      - name: Build APK
        script: flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk

  cercano-oriente-windows:
    name: Cercano Oriente Windows EXE/MSIX
    instance_type: windows_x2
    max_build_duration: 60
    environment:
      flutter: stable
    scripts:
      - name: Generate Windows platform files
        script: flutter create --platforms=windows .
      - name: Remove generated default widget test
        script: Remove-Item -Force -ErrorAction SilentlyContinue test/widget_test.dart
      - name: Dependencies
        script: flutter pub get
      - name: Analyze and test
        script: flutter analyze && flutter test
      - name: Build Windows
        script: flutter build windows --release
      - name: Create MSIX
        script: dart run msix:create --release
    artifacts:
      - build/windows/x64/runner/Release/**/*.exe
      - build/windows/x64/runner/Release/**/*.dll
      - build/windows/x64/runner/Release/**/*.msix
