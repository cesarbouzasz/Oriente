name: Build Android and Windows

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

env:
  FLUTTER_CHANNEL: stable

jobs:
  android-apk:
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Flutter diagnostics
        run: flutter doctor -v

      - name: Generate Android platform project if missing
        run: flutter create --platforms=android .

      - name: Enable Android core library desugaring
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          candidates = [Path('android/app/build.gradle'), Path('android/app/build.gradle.kts')]
          path = next((candidate for candidate in candidates if candidate.exists()), None)
          if path is None:
              raise SystemExit('No se encontró android/app/build.gradle ni android/app/build.gradle.kts')
          text = path.read_text()
          kotlin_dsl = path.suffix == '.kts'
          if 'isCoreLibraryDesugaringEnabled' not in text and 'coreLibraryDesugaringEnabled' not in text:
              marker = 'android {\n'
              if marker not in text:
                  raise SystemExit('No se encontró el bloque android en android/app/build.gradle')
              if kotlin_dsl:
                  options = "    compileOptions {\n        isCoreLibraryDesugaringEnabled = true\n        sourceCompatibility = JavaVersion.VERSION_11\n        targetCompatibility = JavaVersion.VERSION_11\n    }\n"
              else:
                  options = "    compileOptions {\n        coreLibraryDesugaringEnabled true\n        sourceCompatibility JavaVersion.VERSION_11\n        targetCompatibility JavaVersion.VERSION_11\n    }\n"
              text = text.replace(marker, marker + options, 1)
          if 'coreLibraryDesugaring ' not in text:
              if kotlin_dsl:
                  text += "\n\ndependencies {\n    coreLibraryDesugaring(\"com.android.tools:desugar_jdk_libs:2.1.4\")\n}\n"
              else:
                  text += "\n\ndependencies {\n    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'\n}\n"
          path.write_text(text)
          PY

      - name: Get dependencies
        run: flutter pub get

      - name: Build release APK
        # signer_pdf/PDFBox incluye soporte opcional JP2; se desactiva R8 para la APK de prueba.
        run: flutter build apk --release --no-shrink

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cercano-oriente-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

  windows-portable:
    name: Windows portable
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Enable Windows desktop
        shell: pwsh
        run: flutter config --enable-windows-desktop

      - name: Generate Windows platform project if missing
        shell: pwsh
        run: flutter create --platforms=windows .

      - name: Get dependencies
        run: flutter pub get

      - name: Build Windows release
        run: flutter build windows --release

      - name: Package portable application
        shell: pwsh
        run: |
          $source = "build/windows/x64/runner/Release"
          $package = "CercanoOrientePortable"
          New-Item -ItemType Directory -Force -Path $package | Out-Null
          Copy-Item -Path "$source\*" -Destination $package -Recurse -Force
          New-Item -ItemType Directory -Force -Path "$package\datos", "$package\documentos", "$package\backups" | Out-Null
          @'
          CERCANO ORIENTE - VERSIÓN PORTABLE
          ==================================

          Ejecuta cercano_oriente.exe.
          Selecciona una base de datos SQLCipher existente o crea una nueva.
          Mantén la aplicación y sus carpetas juntas.
          No desconectes el pendrive mientras la aplicación esté abierta.
          '@ | Set-Content -Path "$package\README.txt" -Encoding UTF8
          Compress-Archive -Path "$package\*" -DestinationPath "cercano-oriente-windows-portable.zip" -Force

      - name: Upload Windows portable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: cercano-oriente-windows-portable
          path: cercano-oriente-windows-portable.zip
          if-no-files-found: error
          retention-days: 14
